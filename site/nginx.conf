server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

  location /assets/ {
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }
  # Interactive books exported from Billerbook: may be embedded on this site and on tillheidrich.de.
  location /books/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'self' https://tillheidrich.de https://www.tillheidrich.de" always;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri $uri/ $uri/index.html =404;
  }
  location = /health { access_log off; return 200 "ok"; }
  location / { try_files $uri $uri/ $uri.html =404; }
  error_page 404 /index.html;
}
